spring.application.name=collaboration_service

server.port=8083

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/collab_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

logging.level.root=INFO
logging.level.com.skillbridge.messaging=DEBUG
logging.file.name=logs/skillbridge.log



